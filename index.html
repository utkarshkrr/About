  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var now = new Date();
        var hour = now.getHours();

        /*
         * Manual themes remain active until the next
         * 06:00 / 18:00 boundary.
         */

        if (stored === 'light' || stored === 'dark') {
          var boundary = new Date(now);

          if (stored === 'light') {
            boundary.setHours(18, 0, 0, 0);
          } else {
            if (hour >= 18) {
              boundary.setDate(boundary.getDate() + 1);
            }

            boundary.setHours(6, 0, 0, 0);
          }

          if (now < boundary) {
            document.documentElement.setAttribute(
              'data-theme',
              stored
            );

            return;
          }

          localStorage.removeItem('theme');
        }

        /*
         * No active manual theme:
         * follow the clock.
         */
        var automaticTheme =
          hour >= 6 && hour < 18
            ? 'light'
            : 'dark';

        document.documentElement.setAttribute(
          'data-theme',
          automaticTheme
        );
      } catch (e) {
        document.documentElement.setAttribute(
          'data-theme',
          'dark'
        );
      }
    })();
  </script>
